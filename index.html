<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="description"
    content="D.A.B.S.y - AI desk and study companion"
  >

  <link
    rel="manifest"
    href="./manifest.json"
  >

  <link
    rel="icon"
    href="./icon.png"
    type="image/png"
  >

  <!-- CSS MODULES -->

  <link
    rel="stylesheet"
    href="./css/base.css"
  >

  <link
    rel="stylesheet"
    href="./css/face.css"
  >

  <link
    rel="stylesheet"
    href="./css/animations.css"
  >

  <link
    rel="stylesheet"
    href="./css/interface.css"
  >

  <link
    rel="stylesheet"
    href="./css/study.css"
  >

  <title>D.A.B.S.y</title>

</head>


<body>

  <main id="dabsyWorld">

    <!-- BACKGROUND -->

    <div id="backgroundGlow"></div>


    <!-- DABSY -->

    <section id="character">

      <div id="faceGlow"></div>

      <div id="dabsyFace">

        <div
          class="eye left-eye"
          id="leftEye"
        >
          <div class="eyeHighlight"></div>
        </div>

        <div
          class="eye right-eye"
          id="rightEye"
        >
          <div class="eyeHighlight"></div>
        </div>

      </div>


      <!-- HANDS -->

      <div id="hands">

        <div
          id="leftHand"
          class="hand"
        >
          <span></span>
        </div>

        <div
          id="rightHand"
          class="hand"
        >
          <span></span>
        </div>

      </div>

    </section>


    <!-- STUDY CONTENT -->

    <section
      id="contentArea"
      aria-live="polite"
    >

      <div id="contentTitle"></div>

      <div id="contentText"></div>

      <div id="visualArea"></div>

    </section>


    <!-- SPEECH -->

    <section id="conversation">

      <div id="status">
        DABSy Online
      </div>

      <div id="speech">
        Hello! I'm DABSy. 💙
      </div>

    </section>


    <!-- STUDY BADGE -->

    <div id="studyBadge">
      📚 STUDY MODE
    </div>


    <!-- MENU -->

    <div
      id="bubbleMenu"
      aria-hidden="true"
    >

      <button
        id="studyBubble"
        class="bubble"
        type="button"
      >
        <span>📚</span>
        <small>Study</small>
      </button>


      <button
        id="settingsBubble"
        class="bubble"
        type="button"
      >
        <span>⚙️</span>
        <small>Settings</small>
      </button>

    </div>


    <!-- PET HINT -->

    <div id="hint">
      Tap & hold to talk
    </div>

  </main>


  <!-- SETTINGS -->

  <section
    id="settingsPanel"
    aria-hidden="true"
  >

    <div class="settingsCard">

      <button
        id="closeSettings"
        class="closeButton"
        type="button"
      >
        ×
      </button>


      <h2>
        D.A.B.S.y
      </h2>


      <p>
        Connect Gemini to give D.A.B.S.y its brain.
      </p>


      <input
        id="apiKeyInput"
        type="password"
        placeholder="Gemini API key"
        autocomplete="off"
      >


      <div id="keyStatus">
        No Gemini key connected.
      </div>


      <button
        id="saveKey"
        class="primaryButton"
        type="button"
      >
        Connect Gemini
      </button>

    </div>

  </section>


  <!-- JAVASCRIPT -->

  <script
    type="module"
    src="./js/main.js"
  ></script>

</body>

</html>
