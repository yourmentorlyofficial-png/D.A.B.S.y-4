<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#000000"
  >

  <meta
    name="description"
    content="D.A.B.S.y - AI desk and study companion"
  >

  <!-- PWA -->
  <link
    rel="manifest"
    href="./manifest.json"
  >

  <!-- App icon -->
  <link
    rel="icon"
    href="./icon-512.png"
    type="image/png"
  >

  <link
    rel="apple-touch-icon"
    href="./icon-512×512.png"
  >

  <title>D.A.B.S.y</title>

  <link
    rel="stylesheet"
    href="./styles.css"
  >

</head>


<body>

  <main id="dabsyWorld">

    <!-- =================================
         AMBIENT BACKGROUND
    ================================== -->

    <div id="backgroundGlow"></div>


    <!-- =================================
         D.A.B.S.y
    ================================== -->

    <section
      id="character"
      aria-label="D.A.B.S.y"
    >

      <div id="faceGlow"></div>


      <!--
        Expression state is controlled by
        JavaScript through classes on this
        element.

        Examples:

        expression-happy
        expression-sad
        expression-curious
        expression-confused
        expression-surprised
        expression-sleepy
        expression-thinking
        expression-listening
        expression-speaking
      -->

      <div
        id="dabsyFace"
        class="expression-idle"
      >


        <!-- LEFT EYE -->

        <div
          class="eye left-eye"
          aria-hidden="true"
        >

          <div class="eyeShape">

            <div class="eyeHighlight"></div>

            <div class="eyeGlow"></div>

          </div>

        </div>


        <!-- RIGHT EYE -->

        <div
          class="eye right-eye"
          aria-hidden="true"
        >

          <div class="eyeShape">

            <div class="eyeHighlight"></div>

            <div class="eyeGlow"></div>

          </div>

        </div>


      </div>


      <!-- =================================
           CUTE HANDS
      ================================== -->

      <div
        id="hands"
        aria-hidden="true"
      >

        <div
          id="leftHand"
          class="hand"
        >
          <span></span>
        </div>


        <div
          id="rightHand"
          class="hand"
        >
          <span></span>
        </div>

      </div>


      <!-- Tiny expression sparkles -->

      <div
        id="expressionParticles"
        aria-hidden="true"
      >

        <span class="particle particle-1"></span>
        <span class="particle particle-2"></span>
        <span class="particle particle-3"></span>

      </div>

    </section>


    <!-- =================================
         STUDY / LONG ANSWER AREA
    ================================== -->

    <section
      id="contentArea"
      aria-live="polite"
    >

      <div id="contentTitle"></div>

      <div id="contentText"></div>

      <div id="visualArea"></div>

    </section>


    <!-- =================================
         CONVERSATION
    ================================== -->

    <section
      id="conversation"
      aria-live="polite"
    >

      <div id="status">
        DABSy
      </div>


      <div id="speech">
        Hello! I'm DABSy. 💙
      </div>

    </section>


    <!-- =================================
         STUDY MODE BADGE
    ================================== -->

    <div id="studyBadge">
      📚 STUDY MODE
    </div>


    <!-- =================================
         MENU
    ================================== -->

    <div
      id="bubbleMenu"
      aria-hidden="true"
    >

      <button
        id="studyBubble"
        class="bubble"
        type="button"
        aria-label="Toggle Study Mode"
      >

        <span>📚</span>

        <small>
          Study
        </small>

      </button>


      <button
        id="settingsBubble"
        class="bubble"
        type="button"
        aria-label="Open Settings"
      >

        <span>⚙️</span>

        <small>
          Settings
        </small>

      </button>

    </div>


    <!-- =================================
         TOUCH HINT
    ================================== -->

    <div id="hint">
      Tap &amp; hold to talk
    </div>


  </main>


  <!-- =====================================
       SETTINGS PANEL
  ====================================== -->

  <section
    id="settingsPanel"
    aria-hidden="true"
  >

    <div
      class="settingsCard"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settingsTitle"
    >


      <button
        id="closeSettings"
        class="closeButton"
        type="button"
        aria-label="Close settings"
      >
        ×
      </button>


      <h2 id="settingsTitle">
        D.A.B.S.y
      </h2>


      <p>
        Connect Gemini to give D.A.B.S.y its brain.
      </p>


      <input
        id="apiKeyInput"
        type="password"
        placeholder="Gemini API key"
        autocomplete="off"
        spellcheck="false"
      >


      <div
        id="keyStatus"
        aria-live="polite"
      ></div>


      <button
        id="saveKey"
        class="primaryButton"
        type="button"
      >
        Connect Gemini
      </button>


    </div>

  </section>


  <!-- =====================================
       APP
  ====================================== -->

  <script src="./app.js"></script>


</body>

</html>
